<svg viewBox="0 0 1080 960" role="img" aria-label="上位層、VLA 層、低位制御、シミュレーションの四段。指令は上から下へ実線で流れ、センサの観測は左端の破線を通って各層へ戻る。">
  <defs>
    <marker id="m1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-cmd" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m1o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-obs" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="band-a" x="44" y="10" width="1022" height="252" rx="10"/>
  <rect class="band-b" x="44" y="284" width="1022" height="250" rx="10"/>
  <rect class="band-c" x="44" y="596" width="1022" height="186" rx="10"/>
  <rect class="band-d" x="44" y="802" width="1022" height="150" rx="10"/>
  <text x="60" y="36"><tspan class="lt a">上位層</tspan><tspan class="ls" dx="12">サブタスク単位で動作（数秒〜数十秒）</tspan></text>
  <text x="60" y="310"><tspan class="lt b">VLA 層</tspan><tspan class="ls" dx="12">行動は {{policy_hz}} Hz、推論は {{exec_s}} s ごと</tspan></text>
  <text x="60" y="622"><tspan class="lt c">低位制御</tspan><tspan class="ls" dx="12">物理演算の時間刻みごと（{{phys_hz}} Hz）</tspan></text>
  <text x="60" y="828"><tspan class="lt d">シミュレーション</tspan><tspan class="ls" dx="12">MuJoCo</tspan></text>

  <rect class="bx a" x="60" y="50" width="190" height="62" rx="6"/>
  <text class="bt" x="155" y="75" text-anchor="middle">ユーザの指示（日本語）</text>
  <text class="t" x="155" y="98" text-anchor="middle">「全部片付けて」</text>
  <rect class="bx a" x="60" y="128" width="190" height="82" rx="6"/>
  <text class="bt" x="155" y="152" text-anchor="middle">知覚</text>
  <text class="t" x="155" y="174" text-anchor="middle">RGB-D 画像から立方体・</text>
  <text class="t" x="155" y="195" text-anchor="middle">箱の色と位置を推定</text>
  <rect class="bx a" x="285" y="50" width="215" height="132" rx="6"/>
  <text class="bt" x="392" y="76" text-anchor="middle">LLM によるタスク分解</text>
  <text class="t" x="392" y="99" text-anchor="middle">Claude Haiku 4.5</text>
  <text class="t" x="392" y="120" text-anchor="middle">構造化出力</text>
  <text class="t" x="392" y="141" text-anchor="middle">出力をルールで検査</text>
  <text class="tm" x="392" y="164" text-anchor="middle">不正な出力は実行しない</text>
  <rect class="bx a" x="535" y="50" width="205" height="62" rx="6"/>
  <text class="bt" x="637" y="75" text-anchor="middle">サブタスク列</text>
  <text class="t" x="637" y="98" text-anchor="middle">赤 → 緑 → 青</text>
  <rect class="bx a" x="535" y="128" width="205" height="114" rx="6"/>
  <text class="bt" x="637" y="150" text-anchor="middle">完了判定</text>
  <text class="t" x="637" y="171" text-anchor="middle">箱内に当該色を検出</text>
  <text class="t" x="637" y="191" text-anchor="middle">測った開き幅で</text>
  <text class="t" x="637" y="210" text-anchor="middle">開いていることを確認</text>
  <text class="t" x="637" y="230" text-anchor="middle">待機位置で {{judge_hold_s}} s 静止</text>
  <rect class="bx a" x="775" y="50" width="280" height="184" rx="6"/>
  <text class="bt" x="791" y="75">実行器（サブタスクの管理）</text>
  <text class="t" x="791" y="98">サブタスクごとに:</text>
  <text class="t" x="791" y="119">・VLA の指示文と目標色を切り替え</text>
  <text class="t" x="791" y="140">・直前のアクションチャンクを破棄</text>
  <text class="t" x="791" y="161">・切り替えの間はその場で保持</text>
  <text class="t" x="791" y="185">未完了なら待機位置へ戻して再試行</text>
  <text class="tm" x="791" y="208">再試行でも未完了なら停止して報告</text>
  <line class="cmd" x1="250" y1="81" x2="283" y2="81" marker-end="url(#m1c)"/>
  <line class="cmd" x1="250" y1="169" x2="283" y2="169" marker-end="url(#m1c)"/>
  <line class="cmd" x1="500" y1="81" x2="533" y2="81" marker-end="url(#m1c)"/>
  <line class="cmd" x1="740" y1="81" x2="773" y2="81" marker-end="url(#m1c)"/>
  <line class="cmd" x1="740" y1="185" x2="773" y2="185" marker-end="url(#m1c)"/>
  <text class="lab" x="757" y="177" text-anchor="middle">完了</text>
  <polyline class="cmd" points="915,234 915,272 392,272 392,322" marker-end="url(#m1c)"/>
  <text class="lab" x="660" y="298" text-anchor="middle">指示文「put the green cube in the box」と目標色</text>

  <rect class="bx b" x="60" y="340" width="190" height="82" rx="6"/>
  <text class="bt" x="155" y="364" text-anchor="middle">目標位置の入力</text>
  <text class="t" x="155" y="386" text-anchor="middle">俯瞰画像の目標色の領域</text>
  <text class="t" x="155" y="407" text-anchor="middle">→ テーブル面上の (x, y)</text>
  <rect class="bx b" x="285" y="324" width="215" height="158" rx="6"/>
  <text class="bt" x="392" y="348" text-anchor="middle">VLA 方策（SmolVLA）</text>
  <text class="t" x="392" y="370" text-anchor="middle">成功デモと復帰デモで</text>
  <text class="t" x="392" y="390" text-anchor="middle">追加学習</text>
  <text class="t" x="392" y="414" text-anchor="middle">入力: 俯瞰・手首カメラ画像、</text>
  <text class="t" x="392" y="434" text-anchor="middle">状態 {{state_dim}} 次元、指示文</text>
  <text class="tm" x="392" y="462" text-anchor="middle">Flow Matching で行動を生成</text>
  <rect class="bx b" x="535" y="360" width="205" height="88" rx="6"/>
  <text class="bt" x="637" y="386" text-anchor="middle">アクションチャンク</text>
  <text class="t" x="637" y="409" text-anchor="middle">{{chunk}} 行 × {{act_dim}} 次元</text>
  <text class="tm" x="637" y="432" text-anchor="middle">経過分を飛ばして実行</text>
  <rect class="bx b" x="775" y="324" width="280" height="172" rx="6"/>
  <text class="bt" x="791" y="348">非同期実行</text>
  <text class="t" x="791" y="370">{{exec_s}} s ごとに推論を開始</text>
  <text class="t" x="791" y="391">推論時間は実測の分布から</text>
  <text class="t" x="791" y="412">サンプリング（中央値 {{lat_p50}} s）</text>
  <text class="t" x="791" y="433">届くまでは前のチャンクを継続</text>
  <text class="t" x="791" y="454">{{policy_hz}} Hz で 1 行ずつ出力</text>
  <text class="tm" x="791" y="480">RTC（境界の平滑化）は不使用</text>
  <line class="cmd" x1="250" y1="381" x2="283" y2="381" marker-end="url(#m1c)"/>
  <line class="cmd" x1="500" y1="404" x2="533" y2="404" marker-end="url(#m1c)"/>
  <line class="cmd" x1="740" y1="404" x2="773" y2="404" marker-end="url(#m1c)"/>
  <line class="cmd" x1="915" y1="496" x2="915" y2="634" marker-end="url(#m1c)"/>
  <text class="lab" x="905" y="560" text-anchor="end">{{policy_hz}} Hz: エンドエフェクタの変位 Δx</text>
  <text class="lab" x="905" y="580" text-anchor="end">とグリッパの開閉（姿勢は固定）</text>

  <rect class="bx c off" x="775" y="636" width="280" height="122" rx="6"/>
  <text class="bt" x="791" y="660">安全フィルタ（二次計画）</text>
  <text class="t" x="791" y="683">推定した障害物へ近づく Δx を抑制</text>
  <text class="t" x="791" y="705">距離 {{sf_detect_tot_mm}} mm 未満のみを対象</text>
  <text class="tm" x="791" y="732">最終的な実行系では不使用（4.4 節）</text>
  <rect class="bx c" x="535" y="652" width="205" height="92" rx="6"/>
  <text class="bt" x="637" y="680" text-anchor="middle">逆運動学</text>
  <text class="t" x="637" y="703" text-anchor="middle">測定した関節角から</text>
  <text class="t" x="637" y="724" text-anchor="middle">関節の目標を計算</text>
  <rect class="bx c" x="285" y="652" width="215" height="92" rx="6"/>
  <text class="bt" x="392" y="680" text-anchor="middle">制限層</text>
  <text class="t" x="392" y="703" text-anchor="middle">速度・加速度・躍度を</text>
  <text class="t" x="392" y="724" text-anchor="middle">公称の上限内に制限</text>
  <line class="cmd" x1="775" y1="698" x2="742" y2="698" marker-end="url(#m1c)"/>
  <line class="cmd" x1="535" y1="698" x2="502" y2="698" marker-end="url(#m1c)"/>
  <line class="cmd" x1="392" y1="744" x2="392" y2="840" marker-end="url(#m1c)"/>
  <text class="lab" x="404" y="797">関節の位置の指令</text>

  <rect class="bx d" x="60" y="842" width="200" height="96" rx="6"/>
  <text class="bt" x="160" y="865" text-anchor="middle">センサ（雑音・遅延あり）</text>
  <text class="t" x="160" y="886" text-anchor="middle">俯瞰・手首 RGB-D {{cam_hz}} fps</text>
  <text class="t" x="160" y="906" text-anchor="middle">関節の角度・速度</text>
  <text class="t" x="160" y="926" text-anchor="middle">グリッパの開き幅</text>
  <rect class="bx d" x="300" y="842" width="755" height="84" rx="6"/>
  <text class="bt" x="677" y="876" text-anchor="middle">Franka Panda（7 軸）と 3 色の立方体・箱</text>
  <text class="t" x="677" y="903" text-anchor="middle">物理演算の時間刻み {{phys_ms}} ms（{{phys_hz}} Hz）</text>
  <line class="obs" x1="300" y1="884" x2="262" y2="884" marker-end="url(#m1o)"/>
  <polyline class="obs" points="60,884 30,884 30,252 637,252 637,244" marker-end="url(#m1o)"/>
  <polyline class="obs" points="155,252 155,212" marker-end="url(#m1o)"/>
  <polyline class="obs" points="30,381 58,381" marker-end="url(#m1o)"/>
  <polyline class="obs" points="30,520 392,520 392,484" marker-end="url(#m1o)"/>
  <text class="lab-obs" x="420" y="246" text-anchor="middle">画像・ロボットの状態</text>
  <text class="lab-obs" x="70" y="512">画像 2 枚・状態 {{state_base}} 次元</text>
  <text class="lab-obs" x="20" y="640" text-anchor="middle" transform="rotate(-90 20 640)">観測</text>
</svg>
