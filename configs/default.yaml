# すべての設定値（B_提案書 §5、承認 2026-09-25、掲示板 0005 の修正を反映）。
# 流用元の値には出典を併記した。null は Step D 以降で測って決める値。
# コードに数値を直書きしない（手順書 §1-5）。読み込みは recovla.common.config.load()。

paths:                       # すべて <ROOT> からの相対
  models_home: models/hf_home
  policy_snapshot: models/hf_home/hub/models--lerobot--smolvla_libero/snapshots/31d453f7edd78c839a8bbc39744a292686daf0de
  outputs: outputs
  train_output: outputs/train          # 学習の出力先（起動器が <設定名>_<日時> を作る）
  train_logs: outputs/train_logs       # 学習の標準出力の記録
  scene_g0: assets/mjcf/scene_g0.xml
  scene: assets/mjcf/scene_3cube.xml

sim:                         # 流用元 collect.py / closed_loop_eval.py
  timestep: 0.002            # モデルの値と照合する（食い違えば止める）
  steps_per_pad_read: 10     # scripted_demo.STEPS_PER_LOOP
  record_every: 25           # 20 Hz
  stride: 2                  # 10 fps
  image_size: 256
  cameras: [overhead, wrist]
  settle_s: 3.0
  start_pos: [0.307, 0.0, 0.35]
  home_qpos: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
  finger_open: 0.04
  fingertip_offset: 0.1034
  table_top_z: 0.0
  png_compression: 1         # 流用元 recorder.PNG_COMPRESSION（PNG は可逆。速さのため 1）
  workspace: {x: [0.28, 0.62], y: [-0.30, 0.40], z: [0.115, 0.35]}

controller:                  # 流用元 app.make_controller（DLS）と collect の上書き
  ik_gain: 0.08
  max_joint_step: 0.03
  rot_weight: 0.5
  lock_orientation: true
  null_gain: 0.05
  ik_damping: 0.05
  tracker_omega: 20.0
  max_target_vel: 0.8
  q_des_leash: 0.10
  max_dx_norm: 0.10
  scale: 1.0

pad:                         # 流用元 dualsense_device.PROFILES["collect"]
  xy_speed: 0.20
  z_speed: 0.10

scene:
  cube_size: 0.04
  cube_mass: 0.05
  cube_friction: [1.0, 0.005, 0.0001]
  colors: {red: [1, 0, 0, 1], green: [0, 1, 0, 1], blue: [0, 0, 1, 1]}
  box: {pos: [0.45, 0.25, 0.0], inner_half: 0.08, wall_top_z: 0.06, success_inner_half: 0.07, floor_z: 0.01}   # 3 色の場面。内寸 16 cm（掲示板 0030。G0 は configs/g0.yaml の 12 cm のまま）
  region: {x: [0.33, 0.57], y: [-0.21, 0.05]}     # Step D で確定。箱を 16 cm に広げた（0030）ので y の上限を 0.08 → 0.05 に下げ、幅 0.26 を保って負の側へずらした（0.06 以上では、把持のとき手の下端が箱の手前の壁の上端に触れた）
  min_center_dist: 0.09
  yaw_range_deg: 30
  layout_kinds: {empty: 0.57, prefilled_1: 0.14, prefilled_2: 0.29}
  start_at_retreat_prob: 0.33
  box_slots: [[0.04, 0.04], [0.04, -0.04], [-0.04, 0.04], [-0.04, -0.04]]   # 箱の中心からの相対（2x2 の格子、§14 の R3。掲示板 0030 で ±4 cm）
  slot_occupied_radius: 0.03 # 他の立方体の中心が置き場所の中心からこの距離以内なら、その置き場所は埋まっている
  prefilled_yaw_deg: 0.0     # 先客は置き場所の中心に向き 0 で置いてから静止させる
  layout_max_tries: 10000    # 配置の棄却抽選の上限（超えたら止める）
  box_slot_clearance_m: {cube: 0.02, wall: 0.01}   # 着地した立方体どうしの隙間・壁との隙間の下限（mj_geomDistance）。指と壁の隙間は条件にしない（壁の上端より上で放すため）
  settle_prefilled_s: 1.0    # 配置の後、記録の前に物理を回して静止させる時間（配置の種類によらず同じ）
  presentation_camera: {name: presentation, width: 1280, height: 720, pos: [1.2, -0.75, 0.75],
                        xyaxes: [0.72032, 0.693642, 0.0, -0.362773, 0.376726, 0.852334], fovy: 40}

expert:
  speed_scale: [0.9, 1.1]    # ±10%（speed_ref に掛ける）
  speed_ref: {xy: 0.18, z: 0.09}   # 基準の速さ [m/s]。1.1 倍しても DualSense の上限（pad.xy_speed 0.20・z_speed 0.10）を超えない
  gain_per_s: 4.0
  grasp_jitter_m: 0.003
  approach_height: 0.25      # 接近の高さ（x_des）。指先は約 0.15 で、机上・箱の立方体の上を通る
  grasp_z: 0.115             # 流用元 LOW_Z（作業空間の下限）
  lift_m: 0.05
  carry_z: 0.25
  release_z: 0.18            # 流用元 RELEASE_Z
  retreat_pose: [0.33, 0.15, 0.30]   # 待機位置（x_des）。俯瞰カメラから見て立方体と箱の奥にあり、何も隠さない（Step D で分割描画で確認）。開始姿勢 retreat もここ
  idle_after_place_s: 1.5
  move_tol_m: 0.001
  hand_still_speed: 0.005    # 閉じる・放す前に手（hand 原点）の速さがこれ未満であること [m/s]
  close_settle_s: 0.3        # 閉じ切りの判定に使う指の速さの持続時間
  finger_rest_speed: 0.005   # 指の速さ（2 本の和）がこれ未満を「止まった」とする [m/s]
  slip_retry_max: 3
  time_limit_s: 40.0         # 生成の 1 回の試みの上限（超えたら打ち切り）
  phase: {grasped_lift_min_m: 0.01, drop_dist_m: 0.035, rest_speed: 0.01, rest_hold_s: 0.3,
          above_tol_m: 0.006,      # 目標の真上（x_des の水平位置が目標の中心から、ずれ ±3 mm を含めてこの距離以内）
          grasp_z_tol_m: 0.004,    # 把持の高さに着いた（x_des の z が grasp_z + この値以下）
          release_z_tol_m: 0.004,  # 解放の高さに着いた（x_des の z が release_z + この値以下）
          min_grip_gap_m: 0.02,    # 閉じた指の開き（2 本の和）がこれ未満なら何も掴んでいない
          retreat_tol_m: 0.003}    # 待機位置に着いた（x_des が待機位置からこの距離以内）

inject:                      # Step F（手順書 §7）。recovla.expert.inject
  A: {lateral_offset_m: [0.025, 0.035], raise_close_m: [0.015, 0.025], raise_ratio: 0.5, lift_m: [0.03, 0.05],
      confirm: {hand_rise_min_m: 0.03, cube_rise_max_m: 0.01},
      lift_rise_margin_m: 0.002,   # 持ち上げの目標を hand_rise_min + この値以上にする（手先は目標に漸近するので、ちょうど 3 cm では確定しない）
      lift_done_tol_m: 0.001,      # 手先の高さが持ち上げの目標からこの距離以内で、手が止まったら確定の判定をする
      timeout_s: 6.0}              # 発動から確定の判定までの上限（超えたら「注入が効かなかった」）
  B: {min_dist_from_box_m: 0.15}
  C: {min_clearance_m: 0.03, drop_max_tries: 1000}   # ずらし先は scene.region の一様（配置の範囲なので届き、写る）
  landing: {max_tilt_deg: 10, min_clearance_m: 0.03, max_invalid_ratio: 0.2,
            rest_speed: 0.01, rest_hold_s: 0.3, finger_gap_margin_m: 0.005,
            timeout_s: 5.0,              # 開いてから静止までの上限（超えたら着地が不自然）
            view_margin_px: 8}           # 俯瞰カメラの画像の縁からこの画素数以上内側に写ること
  recovery_time_limit_s: 40.0  # 保存を始めてからの立て直しの上限（expert.time_limit_s と同じ値）
  landing_orientation_split_deg: 30   # 完了条件 1: 落下後の向き（指に対する、90° の対称性を除いた角）±30° 以内とそれ以上に分ける

contact:
  robot_bodies: [hand, left_finger, right_finger]
  obstacles: [table_cubes_except_target, box_walls]
  distmax_m: 0.10            # これより遠い組は distmax を返す（計算の打ち切り）
  # 最短距離は、native CCD を有効にし当て板を箱形のメッシュにした「距離の計算専用の模型の写し」で測る
  # （recovla.sim.contact.distance_model。既定の mj_geomDistance は近い組で最大 30 mm 誤った。Step D で確認）

safety_filter:               # 条件付き（接触率 5% 以上のときだけ作る）
  enabled: false
  d_min_m: null
  d_detect_m: null
  gamma: 0.85
  tracking_lag_margin_m: 0.017   # 参照から手先までの遅れ 5〜17mm（落とし穴13）

convert:
  fps: 10
  instruction: "put the {color} cube in the box"

train:
  scope: expert
  batch_size: 32
  seed: 1000
  num_workers: 6
  log_freq: 50
  gpu_limit_gib: 14.0
  rename_map: {observation.images.image: observation.images.camera1,
               observation.images.image2: observation.images.camera2}
  runs:
    smoke: {steps: 1000}
    K1: {steps: 8000, save_freq: 8000}
    R1: {steps: 30000, save_freq: 5000}
    N1: {steps: 30000, save_freq: 5000}
    second_round: {steps: 10000, save_freq: 5000, optimizer_lr: 3.0e-5,
                   warmup_steps: 200, decay_steps: 10000, decay_lr: 2.5e-6}   # §10

runtime:
  mode: rtc                  # sync | naive | rtc
  exec_interval: 10          # s。変えない（掲示板 0010）
  delay_steps: null          # d。Step G の最初に delay_rule で決めて書く（掲示板 0010）
  delay_rule: {min_samples: 50, percentile: 95, action_dt_s: 0.1, max_d: 5}   # d = ceil(p95 / 0.1 s)、RTC あり、最初の 1 回を除く。d > 5 なら止めて報告
  rtc_guidance_horizon: 10   # 10 と 40 を比べる
  rtc_schedule: EXP          # LINEAR と EXP を比べる。必ず明示（落とし穴16）
  rtc_max_guidance_weight: 10.0

eval:
  time_limit_s: 30
  success: {rest_speed: 0.01, rest_hold_s: 1.0}
  error_lift_m: 0.02
  collateral_move_m: 0.02
  reaction_close_m: 0.02
  recovery_lift_m: 0.02
  P1: {delay_s: 0.3, lateral_offset_m: [0.025, 0.035], confirm_window_s: 2.0, confirm_lift_m: 0.02}
  P2: {min_dist_from_box_m: 0.15, min_lift_m: 0.05}
  P3: {min_clearance_m: 0.03}
  induction_min_rate: 0.8
  swap_mid_drop_m: 0.03      # E6: 判定した地点がどの立方体からもこれ以上離れていれば「中間落ち」（手順書 Step E の 3）

seeds:                       # §9 の帯（学習用は 100000 未満、評価は 100000 以上）
  eval_base: 100000
  g0: [100000, 100019]       # G0 の照合だけ（予備実験と同じ種）
  final_eval: [110000, 189999]
  selection: [190000, 199999]

planner:
  model: claude-haiku-4-5
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 30
  step_timeout_s: 30
  retry: 1
  completion_hold_s: 1.0
  color_detect: null         # 色ごとの閾値（Step I）

viz: {fps: 30}
