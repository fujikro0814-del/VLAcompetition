# 段階 3 の動画の場面の並びと長さ（0146・0147、決裁の原則 10/07: 動画は簡易な説明、本文に場面を関連づける、記号を使わない）。
# 説明資料（scripts/60_paper.py）と動画（scripts/62_video.py）の両方がこの表を読み、本文の「動画 m:ss〜m:ss」はここから計算する。
# clip は outputs/demo_v2/<場面>/trial_NN.mp4（scripts/63_demo_v2.py で回し直し、compare で元の記録と同じ経過のものだけ）
scenes:
  - id: title
    dur_s: 8
  - id: problem          # 復帰デモなしで学習したモデルが把持失敗から回復しない
    dur_s: 22
    clip: nat_140017_N/trial_01.mp4     # 140017 緑。約 10 s で把持に失敗し、空のグリッパで箱へ向かったまま回復しない
    t0: 4.0
    t1: 26.0                            # 実時間（10/07 の指示で、倍速は 1.0 や 3.0 のような切りのよい値にする。(t1 − t0) / dur_s が倍速）
  - id: method           # 図 1 の簡略版と、復帰デモの作り方
    dur_s: 22
  - id: contrast         # 同じ配置で左右に並べる（復帰デモあり／なし）。実時間
    dur_s: 22
    clip_with: nat_140017_R/trial_01.mp4      # 約 10 s で把持に失敗 → 掴み直して 24.7 s に収納（元の記録 27.3 s）
    clip_without: nat_140017_N/trial_01.mp4
    t0: 4.0
    t1: 26.0
  - id: task_intro       # 実演の条件（指示・順番の決め方・学習したのは 1 色の動作だけ・1 個あたりの時間とやり直し・20 配置中 6 配置で成功）。10/07 の指示で追加
    dur_s: 11
  - id: task             # 「全部片付けて」→ LLM の分解 → 3 個を収納（3.0 倍速。映像は 70.2 s、終わりの 1.8 s は最後のこまを止めて見せる）
    dur_s: 24
    t0: 0.0
    t1: 72.0
    clip: task_145003/trial_00.mp4      # 145003（10/07 の指示で途中に掴み直しのある場面へ替えた）。緑を 27.1・34.1 s に掴み損ね（空のまま持ち上げ）、40.5 s に掴んで箱へ。70.3 s（元の記録 E7 run_0003: 28.7・30.5 s に掴み損ね、35.4 s に掴んで 47.2 s に収納、71.7 s）
    # 緑は箱に入った後、完了の確認が 30 秒に間に合わず待機位置へ戻り、戻ってから 1.2 s で確認された（元の記録も同じ）
    # 以前の選択: 145016（掴み直しなし、60.9 s）。145007 は回し直しで止まり、145019 は掴み直しの有無が違うので使わない
    events:                             # 右の欄に出す注記（映像の時刻 s）
      - {t0: 27.0, t1: 40.5, text: "緑を掴み損ねた → 掴み直す"}
      - {t0: 40.5, t1: 48.5, text: "3 回目で掴んで箱へ"}
  - id: numbers          # 主な数字 3 つ
    dur_s: 15
  - id: limits           # 限界と今後（2 点）
    dur_s: 10
# 図 2（説明資料）: contrast と同じ場面から 4 時刻
fig2:
  with: {clip: nat_140017_R/trial_01.mp4}
  without: {clip: nat_140017_N/trial_01.mp4}
  times: [7.0, 10.0, 16.0, 24.0]
