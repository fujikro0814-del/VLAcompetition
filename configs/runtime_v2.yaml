# 目標書 v2 の実行系の手段の値（知覚・安全フィルタの余裕・知覚の遅れ・知覚の失敗の止まり方）。sensor_v1 に重ねて読む
# （config.load("sensor_v1", "runtime_v2")）。どの値も学習用のシード（59000〜）だけで決めた（0107 の 4・5、0108 の 2 の 4・5）。
# 決め方と測った値は docs/results/perception_thresholds_v1.json・perception_accuracy_v1.json。
runtime_v2:
  perception:
    # 自己除去の太らせ方と、テーブル面からの閾値（0108 の 2 の 4・5。scripts/83_perception_check.py thresholds、59100〜59109）。
    # 回す前の決まり（ロボットの点が残る割合 ≤ 0.5% の最小）では 3 cm になり、手首の立方体の点の 81% を消して検出が 28% に落ちた。
    # 知覚は色で立方体を拾うので、残った灰色・黒のロボットの点は立方体にならない。そこで知覚の出力（検出 − 取り違え、
    # 俯瞰と手首の悪い方）が最もよい組にした（0112 で報告）
    self_margin_m: 0.0
    table_h: 0.015
    sigma_overhead: 0.008
    sigma_wrist: 0.002
  # 安全フィルタの余裕（0107 の 5）: 机上の立方体の中心の位置の誤差（3 次元）の p95（accuracy、59200〜59219）
  safety_extra_margin_m: 0.0274      # 20 本・更新 3096 回で、中央値 13.9 mm・p95 27.4 mm
  # 知覚の遅れ（0107 の 4-2）: update の計算時間の p99 を 10 ms 単位で切り上げた値
  perception_latency_s: 0.12         # 計算時間の中央値 0.106 s・p99 0.114 s
  checks:                       # 知覚の失敗の止まり方（0107 の 4-4）
    box_frames: 5               # 起動時に箱を当てはめるこまの数
    # 起動時のテーブル面のずれ・箱の既知の位置からのずれは、学習用のシード（30 本・20 本）で見た最大の 2 倍にした。0107 の 4-4 の
    # 初期値（5 mm・1°、2 cm・3°）では、較正誤差の模型（俯瞰の回転 0.5°）のもとで箱のずれが 20 本中 5 本で 2 cm を超え、試行を始めなくなる
    table_dz_m: 0.047           # 見た最大 23.4 mm
    table_angle_deg: 2.49       # 見た最大 1.24°
    box_dev_m: 0.061            # 見た最大 30.3 mm
    box_dev_deg: 1.9            # 見た最大 0.95°
    target_missing_s: 1.0       # サブタスクの始めから目標の色が見つからない時間
